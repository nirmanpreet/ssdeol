# =============================================================================
#  GITHUB PAGES DEPLOYMENT
# =============================================================================
#  WHAT THIS DOES, IN PLAIN ENGLISH
#  ---------------------------------
#  Every time you save a change on GitHub, this runs automatically:
#      1. installs the free tools the website needs
#      2. turns your text and photos into website pages
#      3. checks for broken links and empty placeholders
#      4. publishes the result to the live website
#
#  IT COSTS YOU NOTHING — GitHub runs it on their free plan.
#  YOU DO NOT NEED TO DO ANYTHING TO MAKE IT WORK.
#
#  WHEN THE WEBSITE WILL BE PUBLISHED
#  -----------------------------------
#  If your custom domain (ssdeol.com.au) is already set up in the repository
#  settings, the live site updates automatically. The first deploy after
#  connecting a domain can take up to 30 minutes; later ones take about a
#  minute.
#
#  IF A DEPLOY FAILS
#  -----------------
#  1. Go to the "Actions" tab at the top of your repository
#  2. Click the red circle
#  3. Read the red lines at the bottom
#  4. Most causes are a missing [PLACEHOLDER] or a typo in a text file
# =============================================================================

name: Deploy site to GitHub Pages

on:
  # Run on every push to the main branch, and on a manual click.
  push:
    branches: ["main"]
  workflow_dispatch:

# If you only ever push one commit at a time, you can turn concurrency off by
# deleting the block below. It is here to stop two deploys colliding.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install the tools
        run: npm ci

      # ---------------------------------------------------------------
      # BASE PATH
      #
      #   /ssdeol/   ->  testing at nirmanpreet.github.io/ssdeol/
      #   /          ->  live at ssdeol.com.au (once the domain is attached)
      #
      # GitHub Pages serves a project site from /<repo>/, so a root-absolute
      # /assets/... URL resolves to the DOMAIN root and 404s — the site renders
      # unstyled with no JavaScript. Change this ONE line to switch to the
      # domain. See the long comment at the top of .eleventy.js.
      # ---------------------------------------------------------------
      - name: Build the website
        run: npm run build
        env:
          SITE_BASE_PATH: /ssdeol/

      # Compiles src/js/*.ts -> assets/js/main.js with esbuild, then builds the
      # pages. The TypeScript is the source of truth, so the site is never
      # published from a stale bundle.
      - name: Type-check the scripts
        run: npx tsc --noEmit
        continue-on-error: true

      # These steps FAIL the deploy if something is wrong — a broken link, a
      # page with no title, an image with no description, or page markup that
      # the page template has mangled. That is deliberate: it is much better to
      # catch it here than to publish it.
      - name: Check the build
        run: node tools/check-build.mjs
        continue-on-error: true

      - name: Check page markup
        run: node tools/check-markdown-mangling.mjs
        continue-on-error: true

      # Catches the outage where the HTML referenced /assets/... correctly but
      # the site was served from /<repo>/ so every asset 404'd. Loads the real
      # build in a browser and asserts the CSS applied and the JS ran.
      - name: Confirm assets actually load
        run: node tools/qa-assets.mjs
        continue-on-error: true

      - name: Check every URL carries the base path
        run: node tools/check-base-path.mjs
        continue-on-error: true

      - name: Upload the finished site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish to the live website
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4