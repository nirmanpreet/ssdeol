# ------------------------------------------------------------------
#  THE SEVEN-STEP PROCESS  (homepage + contact page)
# ------------------------------------------------------------------
steps:
  - title: You call or send the quote form
    body: >-
      Tell us what the building is, roughly how big, and when you need it done.
      Photos are helpful but not essential.
  - title: We come and look
    body: >-
      A site visit so we can see the surfaces, the access, the light and the
      things that get missed over the phone.
  - title: Written quote within 48 hours
    body: >-
      Itemised, with the coating system we recommend and the reason we
      recommend it. No obligation.
  - title: We plan around your operation
    body: >-
      Zones, hours and shutdown dates agreed in writing before anyone turns up.
      SWMS prepared for the job.
  - title: We paint
    body: >-
      Full crew, daily clean-down, daily progress update. Aisle widths and
      access routes kept usable.
  - title: Inspection and handover
    body: >-
      Walk the job with you, fix anything you want changed, hand over the
      SWMS and the warranty.
  - title: Five-year warranty
    body: >-
      Written cover against failure of adhesion for five years on the coating
      systems we supply and apply.