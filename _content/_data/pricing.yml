# ==============================================================================
#  INSTANT QUOTE CALCULATOR — RATE TABLE
# ==============================================================================
#  ⚠️  THE NUMBERS BELOW ARE PLACEHOLDERS. THEY ARE NOT YOUR PRICES.       ⚠️
#  ⚠️  The calculator refuses to show any figure until `configured: true`    ⚠️
#  ⚠️  and you have replaced the rates. See TO-FILL-IN-BEFORE-LAUNCH.md.   ⚠️
#
#  HOW THIS WORKS
#  --------------
#  A visitor picks a service, a property type, a size and a timing. The site
#  multiplies that together and shows a RANGE. It always says the range is
#  indicative and that a site visit is needed — it is a tool for someone
#  deciding whether to make contact, NOT a quote.
#
#  WHY A RANGE AND NEVER A SINGLE NUMBER
#  -------------------------------------
#  Because you genuinely cannot know the price until you have seen the surface
#  and the access. Publishing one number would be a claim you cannot keep. The
#  range is wide enough to be honest and tight enough to be useful.
#
#  HOW TO WORK OUT YOUR OWN RATES
#  ------------------------------
#  1. Take your last 10 jobs.
#  2. Divide each invoice total by the floor/wall area involved.
#  3. Take the median (the middle one), not the average — one bad job skews
#     an average badly.
#  4. Set `low` to roughly 0.8x that and `high` to about 1.4x it.
#  5. Leave `minimum` at a mobilisation figure you would actually accept.
#
#  UNITS: dollars per square metre, excluding GST.
# ==============================================================================

# Set this to true ONLY once the rates below are your real numbers.
configured: false

rates:
  - slug: commercial-repainting
    # [PLACEHOLDER: enter your real $/m² range for interior + exterior repaints]
    low: 22
    high: 55
    minimum: 3500

  - slug: epoxy-floor-coatings
    # [PLACEHOLDER: your real $/m² for industrial floor coatings]
    low: 45
    high: 120
    minimum: 6000

  - slug: line-marking
    # [PLACEHOLDER: your real $/m² for line marking]
    low: 6
    high: 18
    minimum: 1500

  - slug: texture-coating
    # [PLACEHOLDER: your real $/m² for texture coating / spray rendering]
    low: 28
    high: 75
    minimum: 4500

  - slug: structural-coatings
    # [PLACEHOLDER: your real $/m² for structural steel / tilt-up coatings]
    low: 35
