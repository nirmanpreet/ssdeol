# ------------------------------------------------------------------------------
#  PROPERTY MULTIPLIERS
#  How much harder each property type is to work in. 1.0 = the baseline.
#  A hospital-grade cleanability spec costs more than an office wall.
# ------------------------------------------------------------------------------
propertyFactors:
  warehouse: 0.9          # big, straightforward, repetitive
  factory: 1.1            # plant, access, safety constraints
  office: 1.0             # the baseline
  retail: 1.05            # shopfronts, public access, out-of-hours
  strata: 1.15            # multiple owners, occupied, committees
  education: 1.2          # child-safety coatings, out-of-hours only
  aged-care: 1.25         # infection control, odour sensitivity, residents
  hospitality: 1.15       # trading-hours restrictions
  transport: 1.1
  utility: 1.3            # specification-heavy, access-difficult

# ------------------------------------------------------------------------------
#  AFTER-HOURS PREMIUM
#  Night and weekend work costs more in labour. Shutdown work often costs less
#  per hour because you are not fighting a live site. Adjust to suit.
# ------------------------------------------------------------------------------
outOfHoursMultiplier: 1.25

# ------------------------------------------------------------------------------
#  SIZE BAND NOTES — shown under the size dropdown to set expectations
# ------------------------------------------------------------------------------
sizeNotes:
  "250": "A small job. Usually a single area or a few rooms."
  "1000": "A medium job. Around one floor of a typical office or warehouse."
  "5000": "A large job. Worth a site visit before anything is committed."
  "15000": "A very large job. We would plan this properly rather than quote from a website."
  "50000": "A major project. Expect a formal scope and a written programme."

# ------------------------------------------------------------------------------
#  DISCLAIMERS — shown under every estimate. Keep these honest and keep them on.
# ------------------------------------------------------------------------------
disclaimers:
  - Indicative only — not a quote.
  - Final price depends on the condition of the substrate, access and preparation needed.
  - We confirm everything in writing after a site visit.