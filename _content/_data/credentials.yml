# ==============================================================================
#  CREDENTIALS & MEMBERSHIPS
# ==============================================================================
#  Only list things you ACTUALLY HOLD. Every item here is displayed on the
#  About page and in the footer trust bar.
#
#  Each credential needs:
#    label  — the short name shown to visitors
#    value  — the detail (an amount, a number, a plain-English explanation)
#    note   — optional extra context. Delete the line if you don't need it.
#
#  To remove a credential, delete the whole "- label:" block (3 or 4 lines).
# ==============================================================================

credentials:
  - label: Public Liability Insurance
    value: $10 million
    note: Cover held for the full duration of every contract.

  - label: Dulux Accredited Painter
    value: Accredited
    note: >-
      Dulux's accreditation programme vets applicators on preparation technique,
      product knowledge and finish quality.

  - label: Paint systems
    value: Dulux & Taubmans
    note: Specification, colour matching and technical support direct from the manufacturer.

  - label: Victorian White Card
    value: All operators
    note: >-
      Every operator holds a current Construction Induction (White) Card from an
      approved Registered Training Organisation.

  - label: WorkCover
    value: Victorian Employer
    note: Workers compensation cover held as required by Victorian law.

  - label: Safe Work Method Statements
    value: Every job
    note: A site-specific SWMS is prepared and signed off before work begins.

  - label: Warranty
    value: 5 years
    note: Written warranty on coating systems against failure of adhesion.

  - label: Established
    value: 2015
    note: The same family team, painting Victoria for over a decade.

# ------------------------------------------------------------------
#  THE FOUR NUMBERS SHOWN IN THE TRUST BAR ACROSS THE SITE
#  Edit these without touching any page.
# ------------------------------------------------------------------
trustBar:
  - value: 2015
    label: Trading since
  - value: $10M
    label: Public liability
  - value: 48 hrs
    label: Quote turnaround
  - value: 8
    label: Painter crew

# ------------------------------------------------------------------
#  THE THREE REASONS WE GIVE FOR CHOOSING US
# ------------------------------------------------------------------
pillars:
  - title: We quote in 48 hours
    body: >-
      A painting quote is easy to sit on a shelf. We send a detailed written
      quote within 48 hours of your site visit, so you can get on with
      comparing us against anyone else.
    icon: clock

  - title: A full crew, not a one-man job
    body: >-
      We run a team of eight painters. That means a warehouse repaint comes
      off in weeks rather than months, and it means when you need six areas
      done at once, we can actually do them at once.
    icon: crew

  - title: Your operation keeps running
    body: >-
      We work after hours, on weekends and across shutdown periods. Inside a
      live warehouse we work zone by zone, keeping aisles clear and plant
      moving. Downtime is expensive — we plan around it rather than through it.
    icon: shutdown